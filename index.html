<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f7f8" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="Dielňa — dielenský pomocník pre stolára: rozteč políc, šuplíky a ďalšie výpočty." />
  <title>Dielňa</title>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <script>
    // téma ešte pred vykreslením (bez bliknutia)
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('dielna:shared:v1') || '{}');
        var m = s.theme || 'system';
        var dark = m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.accent = s.accent || 'teal';
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
